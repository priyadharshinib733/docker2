<!DOCTYPE html>
<html>
<head>
<title>Student Feedback</title>

<style>
body{
    font-family:Arial;
    background:#f2f4f7;
}

.container{
    width:70%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

h1{
    color:#17365d;
    text-align:center;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    margin-top:18px;
    padding:12px 25px;
    background:#17365d;
    color:white;
    border:0;
    border-radius:5px;
}

.thank-you{
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Student Feedback Form</h1>

<label>Course Name</label>
<input value="Agile Development Process & DevOps">

<label>Faculty Name</label>
<input value="Faculty Name">

<label>Student Name</label>
<input placeholder="Enter student name">

<label>Register Number</label>
<input placeholder="Enter register number">

<label>Department</label>
<input value="Software Engineering">

<label>Rating</label>
<select>
    <option>5 - Excellent</option>
    <option>4 - Very Good</option>
    <option>3 - Good</option>
    <option>2 - Average</option>
    <option>1 - Poor</option>
</select>

<label>Feedback / Comments</label>
<textarea rows="5" placeholder="Enter your feedback"></textarea>

<button type="button">Submit Feedback</button>

<p class="thank-you">
    Thank you for submitting your feedback!
</p>

</div>

</body>
</html>
